name: Robot Accélérateur - Scan quotidien

on:
  schedule:
    - cron: '0 21 * * 1-5'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy

      - name: Run Robot Accélérateur
        run: |
          python Robot_Accelerateur.py

      - name: Upload report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: robot-report-${{ github.run_number }}
          path: |
            report_latest.csv
            report_body.txt
            Robot_Accelerateur_Report_*.csv
          if-no-files-found: ignore
          retention-days: 30

      - name: Send daily email
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: Robot Accelerateur - Rapport quotidien
          to: ${{ secrets.EMAIL_TO }}
          from: Robot Accelerateur
          body: file://report_body.txt
          ignore_cert: true
