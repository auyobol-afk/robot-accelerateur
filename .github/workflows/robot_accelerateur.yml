name: Robot Accélérateur - Scan quotidien

on:
  schedule:
    - cron: '0 21 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy

      - name: Run Robot Accélérateur
        run: |
          python Robot_Accelerateur.py

      - name: Publish report to repository
        run: |
          git config --local user.email "robot@github-actions.com"
          git config --local user.name "Robot Accelerateur"
          git add report_latest.csv rapport.html || true
          git diff --quiet && git diff --staged --quiet || git commit -m "Rapport quotidien $(date -u +%Y-%m-%d)" || true
          git push || true
